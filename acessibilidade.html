<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acessibilidade | Terra Bite</title>

    <link rel="stylesheet" href="colors.css">
    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="acessibilidade.css">
</head>

<body>
    <main class="pagina-acessibilidade">
        <h2>Acessibilidade</h2>
        <!-- CONFIGURAÇÕES -->

        <section class="configuracoes">

            <div class="card configuracao">

                <div class="icone-card">
                    ◐
                </div>

                <div class="informacao">
                    <h3>Modo escuro</h3>
                </div>

                <button
                    id="botaoTema"
                    class="switch"
                    aria-label="Ativar modo escuro"
                    aria-pressed="false"
                >

                    <span id="iconeTema">
                        ☀
                    </span>
                </button>
            </div>


            <div class="card configuracao">

                <div class="icone-card">
                    T
                </div>

                <div class="informacao">
                    <h3>Tamanho da fonte</h3>
                </div>

                <div class="botoes-fonte">
                    <button id="diminuirFonte">
                        A−
                    </button>

                    <button id="fonteNormal">

                        <strong>A</strong>

                        <span>
                            Normal
                        </span>

                    </button>

                    <button id="aumentarFonte">
                        A+
                    </button>
                </div>
            </div>
        </section>


        <!-- RECURSOS -->

        <section class="secao">

            <div class="titulo-secao">
                <h2>Recursos de acessibilidade</h2>
            </div>

            <div class="opcoes">

                <button
                    id="leituraVoz"
                    class="card-opcao"
                >

                    <div class="icone-opcao">
                        🔊
                    </div>

                    <h3>
                        Leitura em voz
                    </h3>
                </button>


                <button
                    id="leituraImagens"
                    class="card-opcao"
                >

                    <div class="icone-opcao">
                        ◉
                    </div>

                    <h3>
                        Leitura de imagens
                    </h3>
                </button>


                <button
                    id="abrirDaltonismo"
                    class="card-opcao"
                >

                    <div class="icone-opcao">
                        ◈
                    </div>

                    <h3>
                        Modos de daltonismo
                    </h3>
                </button>
            </div>
        </section>

        <!-- DALTONISMO -->

        <section class="secao daltonismo">

            <div class="titulo-secao">

                <h2>
                    Modos de daltonismo
                </h2>
            </div>


            <div class="lista-modos">


                <button
                    class="modo-cor"
                    data-modo="protanopia"
                >
                    <div class="texto-cor">
                        <h3> Protanopia</h3>
                    </div>

                    <div class="cores">
                        <span class="cor protanopia-1"></span>
                        <span class="cor protanopia-2"></span>
                        <span class="cor protanopia-3"></span>
                    </div>
                </button>

                <button
                    class="modo-cor"
                    data-modo="deuteranopia"
                >
                    <div class="texto-cor">
                        <h3>
                            Deuteranopia
                        </h3>
                    </div>

                    <div class="cores">
                        <span class="cor deuteranopia-1"></span>
                        <span class="cor deuteranopia-2"></span>
                        <span class="cor deuteranopia-3"></span>
                    </div>
                </button>


                <button
                    class="modo-cor"
                    data-modo="tritanopia"
                >

                    <div class="texto-cor">
                        <h3>
                            Tritanopia
                        </h3>
                    </div>

                    <div class="cores">
                        <span class="cor tritanopia-1"></span>
                        <span class="cor tritanopia-2"></span>
                        <span class="cor tritanopia-3"></span>
                    </div>
                </button>

                <button
                    class="modo-cor"
                    data-modo="normal"
                >
                    <div class="texto-cor">
                        <h3>
                            Visão padrão
                        </h3>
                    </div>

                    <div class="cores">
                        <span class="cor padrao-1"></span>
                        <span class="cor padrao-2"></span>
                        <span class="cor padrao-3"></span>
                    </div>
                </button>
            </div>
        </section>
    </main>
<script src="acessibilidade.js"> </script>
</body>
</html>
