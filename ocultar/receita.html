<div class="container">

    <!-- TOPO -->
    <section class="topo">
        <div class="foto-receita">
            <img id="imagemReceita" src="pictures/bolobeterraba.png" alt="Bolo de Beterraba">
            <h3 id="tituloReceita">Bolo de Talos de Beterraba</h3>
            <button id="botaoSalvarReceita" class="botao-salvar-receita" type="button" aria-label="Salvar receita"></button>

        </div>

        <div class="info-lateral">

            <div class="cards-info">

                <div class="card-mini">
                    <img src="icons/colher.png" alt="">
                    <div>
                        <h4>Dificuldade</h4>
                        <p id="dificuldadeReceita">Média</p>
                    </div>
                </div>

                <div class="card-mini">
                    <img src="icons/estrela.png" alt="">
                    <div>
                        <h4>Avaliação</h4>
                        <p id="avaliacaoReceita">4.7 (300)</p>
                    </div>
                </div>

                <div class="card-mini">
                    <img src="icons/relogio.png" alt="">
                    <div>
                        <h4>Preparo</h4>
                        <p id="tempoReceita">50 min</p>
                    </div>
                </div>

                <div class="card-mini">
                    <img src="icons/bolo.png" alt="">
                    <div>
                        <h4>Tipo</h4>
                        <p id="tipoReceita">Sobremesa</p>
                    </div>
                </div>

            </div>

            <div class="partes">
                <img src="icons/folha.png" alt="">
                <div>
                    <h4>Partes Reaproveitadas</h4>
                    <p id="reaproveitadasReceita">Talos de beterraba</p>
                </div>
            </div>
        </div>
    </section>

    <!-- INGREDIENTES E DICAS -->
    <section class="meio">

        <div class="card">
            <h2>Ingredientes</h2>
            <ul id="ingredientesReceita"></ul>

            <h3 id="coberturaTitulo">Cobertura (opcional)</h3>

            <ul id="coberturaReceita"></ul>
        </div>

        <div class="card">
            <h2>Dicas</h2>

            <div id="dicasReceita"></div>
        </div>

    </section>

    <!-- MODO DE PREPARO -->
    <section class="preparo">
        <h2>Modo de Preparo</h2>

        <ol id="preparoReceita"></ol>
    </section>
