<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Terra Bite</title>
     <link rel="icon" type="image/png" href="pictures/image 15.png">

    <link rel="stylesheet" href="NavegarReceitas.css">
    <link rel="stylesheet" href="ocultar/salvas.css">
    <link rel="stylesheet" href="ocultar/acessibilidade-global.css">
</head>
<body>

    <header class="navbar">

        <a href="HomePage.html" class="logo-link">
            <div class="logo">
                <img src="icons/ICONE (1).png" alt="Logo Terra Bite">
                <h1>Terra Bite</h1>
            </div>
        </a>

        <div class="search">
            <img src="icons/Vector.png" alt="Pesquisar">

            <input
            id="buscaSite"
            type="text"
            placeholder="Ex: Casca de batata, Talos, Bananas...">
            <div id="sugestoesBusca" class="sugestoes-busca" hidden></div>
        </div>

        <nav>
            <a href="icons/icone educaçao.png">
                <img src="icons/icone educaçao.png" alt="imagem de livro">
                Educação
            </a>

            <a href="comunidade.html">
                <img src="icons/comunidade.png" alt="" width="24" height="24" aria-hidden="true">
                Comunidade
            </a>

            <a href="perfil.html">
                <img src="icons/icone perfil.png" alt="silhueta de uma pessoa">
                Perfil
            </a>
        </nav>

    </header>

    <main>

        <section class="receitas">

           <h2>Receitas</h2>
            <div id="grid-receitas"></div>

            <a class="acessibilidade" href="#" aria-label="Abrir acessibilidade" title="Acessibilidade">

            <img src="pictures/Vector%20(1).png" alt="Acessibilidade">
            </a>
        </section>
    </main>
<script src="ocultar/salvas.js"></script>
<script src="NavegarReceita.js"></script>
<script src="ocultar/acessibilidade-global.js"></script>
</body>
</html>
