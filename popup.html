<div class="popup" role="dialog"
     aria-modal="true"
     aria-labelledby="tituloPopup">

    <div class="comandos">
        <button type="button" id="voltar"
                class="icone" hidden
                aria-label="Voltar">
            <img src="icons/voltar.png" alt="">
        </button>

        <button type="button" id="fechar"
                class="icone" aria-label="Fechar">
            <img src="icons/fechar.png" alt="">
        </button>
    </div>

    <h2 class="titulo" id="tituloPopup">Acessibilidade</h2>

    <!-- TELA PRINCIPAL -->
    <section id="acessibilidade" class="secao" data-conteudo="acessibilidade">

        <div class="caixa">
            <div class="caixamenor">
                <div class="icone">O</div>
                <h3>Tamanho da fonte</h3>
            </div>

            <div class="caixamenor botoesFonte">
                <button type="button">-A</button>
                <button type="button">100%</button>
                <button type="button">+A</button>
            </div>
        </div>

        <div id="voz" class="caixa">
            <div class="icone">O</div>
            <h3>Leitura em voz</h3>
        </div>

        <div id="imagem" class="caixa">
            <div class="icone">O</div>
            <h3>Leitura de imagens</h3>
        </div>

        <button type="button" class="caixa"
                data-cor="escuro">
            <div id="escuro" class="icone"></div>
            <span>Modo escuro</span>
        </button>

        <button type="button" class="caixa"
                data-cor="claro" hidden>
            <div id="claro" class="icone"></div>
            <span>Modo claro</span>
        </button>

        <button type="button" class="caixa"
                data-abre-conteudo="daltonismo">
            <span id="daltonico" class="icone">O</span>
            <span>Modos de daltonismo</span>
        </button>

    </section>

    <!-- TELA DE DALTONISMO -->
    <section id="daltonismo" class="secao"
             data-conteudo="daltonismo" hidden>

        <h3>Modos de daltonismo</h3>

        <button type="button"
                class="caixa modo-cor"
                data-modo="protanopia">
            Protanopia
        </button>

        <button type="button"
                class="caixa modo-cor"
                data-modo="deuteranopia">
            Deuteranopia
        </button>

        <button type="button"
                class="caixa modo-cor"
                data-modo="tritanopia">
            Tritanopia
        </button>

        <button type="button"
                class="caixa modo-cor"
                data-modo="normal">
            Visão padrão
        </button>

    </section>

</div>
