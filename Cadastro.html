<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Terra Bite</title>

    <link rel="stylesheet" href="Cadastro.css">
</head>

<body>

    <main class="container">

        <div class="btn-sair">
            <img src="icons/voltar.png" alt="Voltar" onclick="history.back()">
        </div>

        <!-- Logo -->
        <div class="logo">
            <img src="icons/ICONE (1).png" alt="Logo Terra Bite">
            <h2>Terra Bite</h2>
        </div>

        <h1>Criar conta</h1>

        <form id="cadastroForm">

            <!-- Nome -->
            <label for="nome">Nome completo</label>

            <div class="input-box">
                <input type="text" id="nome" placeholder="Seu nome completo">
            </div>

            <span id="erroNome" class="mensagem-erro"></span>


            <!-- Aniversário -->
            <label for="aniversario">Aniversário</label>

            <div class="input-box">
                <input type="date" id="aniversario">
            </div>

            <span id="erroAniversario" class="mensagem-erro"></span>


            <!-- E-mail -->
            <label for="email">E-mail</label>

            <div class="input-box">
                <input type="email" id="email" placeholder="seu@email.com">
            </div>

            <span id="erroEmail" class="mensagem-erro"></span>


            <!-- Senha -->
            <label for="senha">Senha</label>

            <div class="input-box">
                <input type="password" id="senha" placeholder="••••••••••">
            </div>

            <span id="erroSenha" class="mensagem-erro"></span>


            <!-- Botão -->
            <button type="submit">
                Cadastrar
            </button>

            <p class="login">
                Já tem uma conta?
                <a href="#">Entrar</a>
            </p>

        </form>

    </main>


    <!-- POP-UP DE SUCESSO -->
    <div id="sucesso" class="sucesso">

        <div class="sucesso-box">

            <h2>Sucesso!</h2>

            <p>Cadastro realizado com sucesso!</p>

            <p>Você será redirecionado para a página inicial.</p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
